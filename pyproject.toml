[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ballout"
version = "0.1.0"
description = "UFC fight history database, matchup analyzer and betting-edge calculator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "requests>=2.28"]

[project.scripts]
ballout = "ballout.cli:main"

[tool.setuptools]
packages = ["ballout"]
