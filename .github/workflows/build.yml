name: Build executables

# Builds a portable single-file program for Windows, macOS and Linux.
# Every run uploads them as downloadable artifacts. Pushing a tag like v1.0,
# or running this workflow by hand with a release tag, also publishes them as
# a GitHub Release (the tag is created on the built commit if it doesn't exist).
on:
  push:
    tags: ["v*"]
    branches: ["main", "master", "claude/**"]
    paths: ["ballout/**", "packaging/**", "tests/**", "requirements*.txt", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.0); leave empty for a test build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: dist/ballout.exe
            asset: ballout-windows.exe
            gui_asset: BallOutGamba-windows.exe
          - os: macos-latest
            binary: dist/ballout
            asset: ballout-macos
          - os: ubuntu-latest
            binary: dist/ballout
            asset: ballout-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install desktop-app dependencies
        if: matrix.gui_asset
        run: pip install -r requirements-desktop.txt

      - name: Unit tests
        run: python -m unittest -v

      - name: Build
        run: python packaging/build.py

      - name: Smoke test
        shell: bash
        run: |
          ${{ matrix.binary }} --help
          printf 'help\nquit\n' | ${{ matrix.binary }}

      - name: Build desktop app
        if: matrix.gui_asset
        run: python packaging/build.py --gui

      - name: Desktop app self-test (opens the window, checks the page rendered)
        if: matrix.gui_asset
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\BallOutGamba.exe" -ArgumentList "--selftest", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "desktop app self-test timed out" }
          if (-not (Test-Path $out)) { throw "desktop app wrote no self-test result (exit code $($p.ExitCode))" }
          $result = Get-Content $out -Raw
          Write-Host $result
          if ($result -notmatch '^OK') { throw "desktop app self-test failed" }

      - name: Rename
        shell: bash
        run: |
          mv ${{ matrix.binary }} dist/${{ matrix.asset }}
          if [ -n "${{ matrix.gui_asset }}" ]; then mv dist/BallOutGamba.exe dist/${{ matrix.gui_asset }}; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        if: matrix.gui_asset
        with:
          name: ${{ matrix.gui_asset }}
          path: dist/${{ matrix.gui_asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Ball Out Gamba ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: |
            dist/${{ matrix.asset }}
            ${{ matrix.gui_asset && format('dist/{0}', matrix.gui_asset) || '' }}
