name: Build executables

# Builds a portable single-file program for Windows, macOS and Linux.
# Every run uploads them as downloadable artifacts. Pushing a tag like v1.0,
# or running this workflow by hand with a release tag, also publishes them as
# a GitHub Release (the tag is created on the built commit if it doesn't exist).
on:
  push:
    tags: ["v*"]
    branches: ["main", "master", "claude/**"]
    paths: ["ballout/**", "packaging/**", "tests/**", "requirements.txt", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.0); leave empty for a test build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: dist/ballout.exe
            asset: ballout-windows.exe
          - os: macos-latest
            binary: dist/ballout
            asset: ballout-macos
          - os: ubuntu-latest
            binary: dist/ballout
            asset: ballout-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Unit tests
        run: python -m unittest -v

      - name: Build
        run: python packaging/build.py

      - name: Smoke test
        shell: bash
        run: |
          ${{ matrix.binary }} --help
          printf 'help\nquit\n' | ${{ matrix.binary }}

      - name: Rename
        shell: bash
        run: mv ${{ matrix.binary }} dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Ball Out Gamba ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: dist/${{ matrix.asset }}
